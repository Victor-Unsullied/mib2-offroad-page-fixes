name: Bug report
description: Report a problem inspecting, enabling, or using the Offroad page.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: This report is public. Review screenshots and error text for personal information. Keep raw captures, vehicle configuration and private connection details local.
  - type: input
    id: version
    attributes:
      label: Project version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: unit
    attributes:
      label: Head unit, Train and MU
      placeholder: Delphi 874B / MST2_EU_VW_P0635D / 0757
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
      description: Include the command or menu step, whether navigation and Offroad were present initially, and any relevant error text.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Computer operating system and Python version
